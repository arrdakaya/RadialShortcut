# Pushing a tag like v0.9.0 tests, builds and publishes a release: the setup for people,
# the zip and its checksum for the in-app updater. The version comes from the tag.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version from tag
        shell: pwsh
        run: echo "VERSION=$('${{ github.ref_name }}'.TrimStart('v'))" >> $env:GITHUB_ENV

      - name: Test
        run: dotnet test tests/RadialShortcut.Tests -c Release

      - name: Publish
        run: dotnet publish src/RadialShortcut.App -c Release -r win-x64 --self-contained true -p:Version=${{ env.VERSION }} -o artifacts/rel/app

      - name: Zip for the updater
        shell: pwsh
        run: |
          Remove-Item artifacts/rel/app/*.pdb
          Compress-Archive artifacts/rel/app/* artifacts/rel/RadialShortcut-win-x64.zip -CompressionLevel Optimal
          $hash = (Get-FileHash artifacts/rel/RadialShortcut-win-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  RadialShortcut-win-x64.zip" | Out-File artifacts/rel/RadialShortcut-win-x64.zip.sha256 -Encoding ascii -NoNewline

      - name: Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q /DAppVersion=${{ env.VERSION }} installer/RadialShortcut.iss

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create ${{ github.ref_name }}
          artifacts/rel/RadialShortcut-Setup.exe
          artifacts/rel/RadialShortcut-win-x64.zip
          artifacts/rel/RadialShortcut-win-x64.zip.sha256
          --title "RadialShortcut ${{ env.VERSION }}"
          --generate-notes
